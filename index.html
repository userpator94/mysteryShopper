<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mystery Shopper</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<!--
  Шрифты подключены НЕ как render-blocking <link rel="stylesheet">, а через
  media="print" + onload-трюк: браузер скачивает CSS с высоким приоритетом,
  но не блокирует первую отрисовку страницы, ожидая ответ от fonts.googleapis.com.
  Это критично для пользователей, у которых Google-домены медленно отвечают или
  недоступны (например, часть мобильных операторов в РФ) — раньше в таких случаях
  страница оставалась полностью белой (даже форма логина не рендерилась) до тех
  пор, пока запрос к Google Fonts не завершался по таймауту браузера.
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" media="print" onload="this.media='all'"/>
<noscript>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
</noscript>
<style>
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    .text-shadow {
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    }
  </style>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="bg-white font-display">
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
