<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mystery Shopper</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<!--
  Inter self-hosted через @fontsource/inter (см. src/main.ts) — шрифт
  раздаётся с того же домена, что и сайт, без внешних запросов на
  fonts.googleapis.com. Иконки — инлайн SVG (src/utils/icons.ts) вместо
  иконочного шрифта Material Symbols. Это убирает зависимость от внешних
  CDN, из-за недоступности/медленного ответа которых (характерно для части
  мобильных сетей РФ, в т.ч. из встроенного браузера Telegram) страница
  раньше могла оставаться полностью белой.
-->
<style>
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    .text-shadow {
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body class="bg-white font-display">
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
